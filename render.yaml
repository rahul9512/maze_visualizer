services:
  - type: web
    name: maze-visualizer
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn maze_visualizer.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
